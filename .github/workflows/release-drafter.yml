name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    # GitHub-only: release-drafter/release-drafter isn't in the actions/* org
    # that data.forgejo.org mirrors — on Forgejo the clone 404s before
    # checkout. The release draft it maintains lives on GitHub anyway.
    if: github.server_url == 'https://github.com'

    steps:
      - name: Run release drafter
        uses: release-drafter/release-drafter@v7
        with:
          # The next marketing version. GitHub's newest release (v1.6.3) lags
          # the stores, so Release Drafter can't infer it; bump this whenever
          # a new version train opens.
          version: 1.6.7
