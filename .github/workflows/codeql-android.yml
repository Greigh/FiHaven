name: CodeQL (Java / Kotlin)

# Split out of codeql.yml so the path filter below can apply: on.push.paths is
# workflow-wide, not per-job. This job has to run a full Gradle build to see any
# Kotlin at all, which a commit outside android/ can't change. The weekly cron
# re-analyses regardless, so alerts never go stale.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/codeql-android.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  java-kotlin:
    name: Analyze Java / Kotlin
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Trace a real Gradle build: build-mode:none sees no Kotlin source for
          # this Android project, and autobuild can't drive it — so build manually.
          build-mode: manual

      - name: Build Android app (traced for CodeQL)
        working-directory: android
        # Requires Kotlin < 2.3.30 in android/build.gradle.kts until CodeQL supports 2.4+
        # (github.com/github/codeql/issues/21938).
        run: ./gradlew :app:assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
