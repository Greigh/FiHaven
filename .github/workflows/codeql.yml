name: CodeQL

# The Swift and Java/Kotlin analyses live in codeql-swift.yml and
# codeql-android.yml so each can carry its own on.push.paths filter — path
# filters apply per workflow, not per job. JavaScript/TypeScript stays
# unfiltered: it's the largest surface here and the analysis takes ~2 minutes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  javascript-typescript:
    name: Analyze JavaScript / TypeScript
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
