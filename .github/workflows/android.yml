name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub-only: the Gradle steps fail on every Forgejo run — that runner's
    # image doesn't carry the Android toolchain the build needs. Revisit if
    # the image ever gains one.
    if: github.server_url == 'https://github.com'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify Android core tests
        working-directory: android
        run: ./gradlew :core:test

      - name: Verify Android app unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug
