name: Codecov

on: push

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --coverage

      # Forgejo resolves `uses:` against data.forgejo.org, which mirrors
      # actions/* but not codecov/* — the action clone 404s and the whole job
      # dies before checkout. The standalone CLI uploads from anywhere.
      # The upload is best-effort end to end: cli.codecov.io has had TLS
      # outages that failed otherwise-green runs, so a dead endpoint skips
      # the upload rather than turning the job red.
      - name: Upload results to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if curl -sSfLo /tmp/codecov-cli https://cli.codecov.io/latest/linux/codecov; then
            chmod +x /tmp/codecov-cli
            /tmp/codecov-cli upload-process -t "$CODECOV_TOKEN" || true
          else
            echo "::warning::codecov CLI download failed — skipping coverage upload"
          fi
        if: ${{ !cancelled() }}
