name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The native issuer logos are generated from client/js/issuerLogos.js;
      # fail the build if someone edited the table without regenerating.
      - name: Check issuer logos are in sync
        run: node scripts/sync-issuer-logos.js --check

      - name: Build
        run: npm run build
