<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="FiHaven Family">
  <defs>
    <style>
      @font-face {
        font-family: 'Manrope';
        src: url('../../../android/play-store/Manrope-Variable.ttf') format('truetype');
        font-weight: 100 800;
      }
      .display { font-family: 'Manrope', system-ui, sans-serif; font-weight: 800; }
      .body { font-family: 'Manrope', system-ui, sans-serif; font-weight: 500; }
      .label { font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAFB"/>
      <stop offset="1" stop-color="#EAF0FE"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C7DF0"/>
      <stop offset="1" stop-color="#3D6FE1"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.92" cy="0.06" r="0.55">
      <stop offset="0" stop-color="#3D6FE1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3D6FE1" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3D6FE1" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#orb)"/>

  <!-- Brand lockup -->
  <g transform="translate(412 96)">
    <rect width="56" height="56" rx="14" fill="url(#icon-bg)"/>
    <g fill="#fff" transform="translate(2 2) scale(0.8125)">
      <rect x="16" y="17" width="7" height="30" rx="2"/>
      <rect x="16" y="17" width="22" height="7" rx="2"/>
      <rect x="16" y="29" width="17" height="6" rx="2"/>
      <rect x="41" y="27" width="7" height="20" rx="2"/>
      <circle cx="44.5" cy="20" r="4"/>
    </g>
    <text class="display" x="74" y="39" font-size="32" fill="#15161A" letter-spacing="-1">FiHaven</text>
  </g>

  <!-- Eyebrow: three-member household -->
  <g transform="translate(392 210)">
    <rect width="240" height="44" rx="22" fill="#EAF0FE"/>
    <circle cx="40" cy="22" r="9" fill="#3D6FE1"/>
    <circle cx="60" cy="22" r="9" fill="#3D6FE1" opacity="0.6"/>
    <circle cx="80" cy="22" r="9" fill="#3D6FE1" opacity="0.35"/>
    <text class="label" x="98" y="29" font-size="18" fill="#3D6FE1" letter-spacing="0.2">Up to 3 people</text>
  </g>

  <!-- Plan -->
  <text class="display" x="512" y="404" font-size="152" fill="#15161A" text-anchor="middle" letter-spacing="-6">Family</text>
  <text class="display" x="512" y="496" font-size="64" fill="#3D6FE1" text-anchor="middle" letter-spacing="-2">Shared household</text>

  <!-- Feature card -->
  <g filter="url(#card-shadow)">
    <rect x="152" y="580" width="720" height="272" rx="28" fill="#FFFFFF" stroke="#E5E7EB"/>

    <circle cx="216" cy="648" r="18" fill="#EAF0FE"/>
    <path d="M209 648 l5 5 l9 -10" fill="none" stroke="#3D6FE1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="body" x="256" y="657" font-size="26" fill="#15161A" letter-spacing="-0.4">Everything in FiHaven Pro</text>

    <circle cx="216" cy="716" r="18" fill="#EAF0FE"/>
    <path d="M209 716 l5 5 l9 -10" fill="none" stroke="#3D6FE1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="body" x="256" y="725" font-size="26" fill="#15161A" letter-spacing="-0.4">One shared household, up to 3 people</text>

    <circle cx="216" cy="784" r="18" fill="#EAF0FE"/>
    <path d="M209 784 l5 5 l9 -10" fill="none" stroke="#3D6FE1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="body" x="256" y="793" font-size="26" fill="#15161A" letter-spacing="-0.4">Plan bills and goals together</text>
  </g>

  <text class="body" x="512" y="936" font-size="26" fill="#6C6E77" text-anchor="middle" letter-spacing="-0.3">Quiet money. Calm month.</text>
</svg>
